<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="aw-logo-title aw-logo-desc">
  <title id="aw-logo-title">Automate Workflow Logo</title>
  <desc id="aw-logo-desc">Deep crimson emblem featuring code brackets, /automation wordmark, and a circuit gear icon.</desc>
  <defs>
    <radialGradient id="logo-radial" cx="50%" cy="46%" r="68%">
      <stop offset="0%" stop-color="#8F0129"/>
      <stop offset="55%" stop-color="#730424"/>
      <stop offset="100%" stop-color="#5A051C"/>
    </radialGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2D020D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded crimson badge -->
  <rect x="4" y="4" width="232" height="232" rx="44" fill="url(#logo-radial)" stroke="#A60D37" stroke-width="2.5"/>
  <rect x="10" y="10" width="220" height="220" rx="39" fill="none" stroke="#EBE4E5" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Official </> code emblem -->
  <g fill="none" stroke="#F4ECEE" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-shadow)">
    <polyline points="72,54 36,84 72,114"/>
    <line x1="130" y1="34" x2="100" y2="134"/>
    <polyline points="160,54 196,84 160,114"/>
  </g>

  <!-- Gear + circuit tree icon positioned cleanly below > -->
  <g transform="translate(198, 142)" filter="url(#soft-shadow)">
    <g fill="#F4ECEE">
      <rect x="-3.8" y="-19.5" width="7.6" height="39" rx="2.4"/>
      <rect x="-19.5" y="-3.8" width="39" height="7.6" rx="2.4"/>
      <rect x="-3.8" y="-19.5" width="7.6" height="39" rx="2.4" transform="rotate(45)"/>
      <rect x="-19.5" y="-3.8" width="39" height="7.6" rx="2.4" transform="rotate(45)"/>
      <circle cx="0" cy="0" r="14.5"/>
    </g>
    <circle cx="0" cy="0" r="10.2" fill="#730424"/>
    <g fill="none" stroke="#F4ECEE" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 6.5 V -5.5"/>
      <path d="M 0 2.5 L -4.5 -1.8 V -4.5"/>
      <path d="M 0 1 L 4.5 -2.5 V -4.5"/>
    </g>
    <g fill="#F4ECEE">
      <circle cx="0" cy="-6.2" r="1.6"/>
      <circle cx="-4.5" cy="-5" r="1.4"/>
      <circle cx="4.5" cy="-5" r="1.4"/>
    </g>
  </g>

  <!-- /automation wordmark -->
  <text x="120" y="198" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" letter-spacing="-0.4" fill="#F4ECEE" filter="url(#soft-shadow)">/automation</text>
</svg>
